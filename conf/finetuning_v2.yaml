base_model: data/models/Qwen2.5-Coder-3B-Instruct
dataset_dir: data/finetuning_v2
output_dir: data/finetuning_v2/output/qwen2.5-coder-3b-sql-v2
max_seq_length: 2048
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
learning_rate: 0.0002
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
logging_steps: 5
save_strategy: epoch
evaluation_strategy: epoch
seed: 42
